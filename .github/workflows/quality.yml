name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-and-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q --cov=scripts --cov-report=term-missing
      - name: Lint Python
        run: ruff check scripts tests
      - name: Check Python formatting
        run: ruff format --check scripts tests
      - name: Type check
        run: mypy scripts
      - name: Lint database SQL
        run: >-
          sqlfluff lint
          sql/02_validate_relational_database.sql
          sql/05_validate_five_country_database.sql
          --dialect duckdb
          --rules CP01
      - name: Check generated documentation
        run: python scripts/support_check_docs_consistency.py
      - name: Check headline numbers and static README strings
        run: python scripts/18_check_headline_numbers.py
